<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ไฟป่า 2570 - ระบบเฝ้าระวังและยุทธวิธีดับไฟป่า อ.สันทราย จ.เชียงใหม่</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95) !important; color: #f8fafc !important; border: 1px solid #334155; border-radius: 0.75rem !important; }
        .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }
        .leaflet-container { font-family: 'Sarabun', sans-serif !important; background: #0b1120; }
    </style>
</head>
<body class="h-screen flex flex-col select-none">
    <header class="bg-slate-900/95 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-30 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-red-600 flex items-center justify-center shadow-md">
                <i class="fa-solid fa-fire-flame-curved text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-white">ศูนย์ปฏิบัติการเฝ้าระวังและควบคุมไฟป่า อำเภอสันทราย</h1>
                <p class="text-xs text-slate-400">กองร้อยอาสารักษาดินแดนอำเภอสันทราย ที่ 15 • ระบบแผนที่ยุทธวิธี & ดาวเทียม NOAA (VIIRS)</p>
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
        <aside class="w-full lg:w-96 bg-slate-900 border-r border-slate-800 flex flex-col p-4 space-y-4 overflow-y-auto z-20 shrink-0">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-3 space-y-2.5">
                <h3 class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                    <i class="fa-solid fa-eye text-emerald-400"></i> เปิด/ปิด ชั้นข้อมูลบนแผนที่
                </h3>
                
                <!-- พิกัดกำลังพล (11-Bel) -->
                <label class="flex items-center justify-between p-2 rounded-lg bg-slate-900/60 hover:bg-slate-900 cursor-pointer border border-slate-800">
                    <div class="flex items-center gap-2.5">
                        <input type="checkbox" id="chkPersonnel" checked onchange="togglePersonnelLayer()" class="w-4 h-4 accent-orange-500 rounded">
                        <span class="text-xs font-medium text-slate-200">พิกัดกำลังพล (11-Bel)</span>
                    </div>
                    <span class="w-3 h-3 rounded-full bg-blue-500 ring-2 ring-blue-500/30"></span>
                </label>

                <label class="flex items-center justify-between p-2 rounded-lg bg-slate-900/60 hover:bg-slate-900 cursor-pointer border border-slate-800">
                    <div class="flex items-center gap-2.5">
                        <input type="checkbox" id="chkStrategic" checked onchange="updateLayers()" class="w-4 h-4 accent-orange-500 rounded">
                        <span class="text-xs font-medium text-slate-200">จุดยุทธศาสตร์ & เฝ้าระวัง (27 จุด)</span>
                    </div>
                    <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                </label>

                <label class="flex items-center justify-between p-2 rounded-lg bg-slate-900/60 hover:bg-slate-900 cursor-pointer border border-slate-800">
                    <div class="flex items-center gap-2.5">
                        <input type="checkbox" id="chkHotspots" checked onchange="updateLayers()" class="w-4 h-4 accent-orange-500 rounded">
                        <span class="text-xs font-medium text-slate-200">จุดความร้อนย้อนหลังปี 2026 (128 จุด)</span>
                    </div>
                    <span class="w-3 h-3 rounded-full bg-red-500"></span>
                </label>
            </div>
        </aside>

        <main class="flex-1 relative h-full">
            <div id="map" class="w-full h-full z-10"></div>
        </main>
    </div>

    <script>
        let map;
        let layerPersonnel = L.layerGroup();
        let layerStrategic = L.layerGroup();
        let layerHotspots = L.layerGroup();
        let marker = null;

        // ตัวอย่างจุดยุทธศาสตร์
        const strategicPoints = [
            { name: "กองร้อยอาสารักษาดินแดนอำเภอสันทราย ที่ 15", lat: 18.8486175, lng: 99.0453617, cat: "ฐานปฏิบัติการ", note: "ศูนย์บัญชาการ" }
        ];

        // ข้อมูลจุดความร้อน 128 จุด (ย่อส่วนโครงสร้าง)
        const hotspotsData = [
            { seq: 1, tambon: "สันทรายน้อย", areaType: "ชุมชนและอื่น ๆ", lat: 18.823178, lng: 99.032403, month: "02" },
            { seq: 2, tambon: "แม่แฝก", areaType: "ป่าสงวนแห่งชาติ", lat: 19.094890, lng: 98.977536, month: "03" }
        ];

        window.onload = function() {
            initMap();
            renderStrategic();
            renderHotspots();
            loadPersonnelLocations();
            setInterval(loadPersonnelLocations, 10000);
        };

        function initMap() {
            map = L.map('map', { center: [19.005, 99.035], zoom: 13 });
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

            layerPersonnel.addTo(map);
            layerStrategic.addTo(map);
            layerHotspots.addTo(map);
        }

        function togglePersonnelLayer() {
            if (document.getElementById('chkPersonnel').checked) map.addLayer(layerPersonnel);
            else map.removeLayer(layerPersonnel);
        }

        function updateLayers() {
            if (document.getElementById('chkStrategic').checked) map.addLayer(layerStrategic);
            else map.removeLayer(layerStrategic);

            if (document.getElementById('chkHotspots').checked) map.addLayer(layerHotspots);
            else map.removeLayer(layerHotspots);
        }

        function renderStrategic() {
            strategicPoints.forEach(sp => {
                L.marker([sp.lat, sp.lng]).bindPopup(`<b>${sp.name}</b><br>${sp.note}`).addTo(layerStrategic);
            });
        }

        function renderHotspots() {
            hotspotsData.forEach(h => {
                L.circleMarker([h.lat, h.lng], { radius: 6, fillColor: '#ef4444', color: '#fff', weight: 1 }).bindPopup(`จุดความร้อน #${h.seq} ต.${h.tambon}`).addTo(layerHotspots);
            });
        }

        function loadPersonnelLocations() {
            const webAppUrl = "https://script.google.com/macros/s/AKfycbzf1A4RMck9w5fYyDhRgUUPaEnuHGkZGrVvmBy21G8ofA8kMAivMMW1BPoczPTs0Q/exec";
            fetch(webAppUrl)
                .then(res => res.json())
                .then(data => {
                    const records = Array.isArray(data) ? data : data.records;
                    if (records && records.length > 0) {
                        const latest = records[records.length - 1];
                        if (latest.lat && latest.lng) {
                            const latLng = [parseFloat(latest.lat), parseFloat(latest.lng)];
                            if (marker) marker.setLatLng(latLng);
                            else marker = L.marker(latLng).addTo(layerPersonnel);
                            marker.bindPopup(`<b>กำลังพล: ${latest.name || '11-Bel'}</b><br>เวลา: ${latest.time || '-'}<br>แบตเตอรี่: ${latest.battery || '-'}%`);
                        }
                    }
                })
                .catch(err => console.error(err));
        }
    </script>
</body>
</html>
